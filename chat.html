<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat – 3475 Kraftverket</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .dm-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 1rem;
      height: calc(100vh - 68px - 6rem);
      min-height: 520px;
    }
    @media (max-width: 720px) {
      .dm-layout { grid-template-columns: 1fr; height: auto; }
      .dm-sidebar { max-height: 280px; }
    }
    .dm-sidebar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow-y: auto;
      padding: .5rem;
      display: flex; flex-direction: column;
    }
    .sidebar-actions {
      display: flex; gap: .35rem; padding: .5rem;
      border-bottom: 1px solid var(--border); margin-bottom: .5rem;
    }
    .sidebar-actions button {
      flex: 1; padding: .55rem .35rem;
      background: var(--surface2); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm);
      font-size: .78rem; font-weight: 700; cursor: pointer;
      transition: all .15s;
    }
    .sidebar-actions button:hover { border-color: var(--orange); color: var(--orange); }
    .sidebar-section {
      font-size: .72rem; text-transform: uppercase; letter-spacing: .5px;
      color: var(--text-muted); padding: .75rem .75rem .5rem;
    }
    .contact {
      display: flex; align-items: center; gap: .75rem;
      padding: .65rem .75rem; border-radius: var(--radius-sm);
      cursor: pointer; transition: background .15s;
    }
    .contact:hover { background: var(--surface2); }
    .contact.active { background: var(--orange-glow); border: 1px solid var(--orange); }
    .contact img.avatar {
      width: 38px; height: 38px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--orange);
    }
    .group-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--orange); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 1.1rem;
      border: 2px solid var(--orange);
      flex-shrink: 0;
    }
    .contact .info { flex: 1; min-width: 0; }
    .contact .name { font-weight: 700; font-size: .92rem; }
    .contact .preview { color: var(--text-muted); font-size: .76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dm-main {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: grid; grid-template-rows: auto 1fr auto;
      overflow: hidden;
    }
    .dm-header {
      padding: .9rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: .75rem;
      background: #111;
    }
    .dm-header img, .dm-header .group-avatar { width: 40px; height: 40px; }
    .dm-header .name { font-weight: 800; }
    .dm-header .sub { font-size: .78rem; color: var(--text-muted); }
    .empty-chat {
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: .92rem; padding: 3rem 1rem;
      text-align: center;
    }
    .dm-messages {
      overflow-y: auto; padding: 1rem;
      display: flex; flex-direction: column; gap: .85rem;
    }
    .pick-list {
      max-height: 280px; overflow-y: auto;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: .35rem;
    }
    .pick-row {
      display: flex; align-items: center; gap: .65rem;
      padding: .5rem; border-radius: var(--radius-sm);
      cursor: pointer; transition: background .15s;
    }
    .pick-row:hover { background: var(--surface2); }
    .pick-row img {
      width: 36px; height: 36px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--orange);
    }
    .pick-row .pname { font-weight: 700; font-size: .92rem; flex: 1; }
    .pick-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--orange); }
  </style>
</head>
<body>
  <div id="header-slot"></div>

  <main class="container">
    <div class="section-hero">
      <h1>Meldinger & <span class="accent">grupper</span></h1>
      <p class="lead">Felles chat, private samtaler og grupper — i sanntid.</p>
    </div>

    <div class="dm-layout">
      <aside class="dm-sidebar">
        <div class="sidebar-actions">
          <button onclick="openNewDM()">+ Ny samtale</button>
          <button onclick="openNewGroup()">+ Ny gruppe</button>
        </div>

        <div class="sidebar-section">Felles</div>
        <div id="publicConv"></div>

        <div class="sidebar-section">Samtaler</div>
        <div id="convList"></div>
      </aside>

      <section class="dm-main">
        <div class="dm-header" id="chatHeader" style="display:none;">
          <div id="chatHeaderIcon"></div>
          <div>
            <div class="name" id="chatName"></div>
            <div class="sub" id="chatSub"></div>
          </div>
        </div>

        <div class="dm-messages" id="dmMessages">
          <div class="empty-chat" id="emptyChat">Velg en samtale eller start en ny fra menyen til venstre.</div>
        </div>

        <form class="chat-input" id="dmForm" style="display:none;">
          <input id="dmInput" type="text" placeholder="Skriv en melding..." autocomplete="off" required />
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      </section>
    </div>
  </main>

  <!-- Modal: ny samtale -->
  <div class="modal-backdrop" id="newDmModal" onclick="if(event.target===this)closeModals()">
    <div class="modal">
      <div class="body">
        <button class="close" onclick="closeModals()">✕</button>
        <h2>Ny privat samtale</h2>
        <p class="muted" style="font-size:.9rem; margin-bottom:1rem;">Velg et medlem å starte samtale med.</p>
        <div class="pick-list" id="dmPickList"><div class="empty-state">Laster...</div></div>
      </div>
    </div>
  </div>

  <!-- Modal: ny gruppe -->
  <div class="modal-backdrop" id="newGroupModal" onclick="if(event.target===this)closeModals()">
    <div class="modal">
      <div class="body">
        <button class="close" onclick="closeModals()">✕</button>
        <h2>Ny gruppe</h2>
        <div class="field">
          <label for="groupName">Gruppenavn</label>
          <input id="groupName" type="text" placeholder="F.eks. Morgentreningen" />
        </div>
        <div class="field">
          <label>Velg medlemmer</label>
          <div class="pick-list" id="groupPickList"><div class="empty-state">Laster...</div></div>
        </div>
        <button class="btn btn-primary btn-full" onclick="createGroup()">Opprett gruppe</button>
      </div>
    </div>
  </div>

  <div id="footer-slot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="app.js"></script>
  <script>
    const PUBLIC_CONV_ID = "00000000-0000-0000-0000-000000000001";
    let me = null;
    let activeConvId = null;
    let allProfiles = [];
    let myConvs = [];
    let realtimeSub = null;

    function esc(s) { return (s ?? "").toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
    function fmtTime(ts) {
      const d = new Date(ts);
      const today = new Date();
      const sameDay = d.toDateString() === today.toDateString();
      const t = d.toLocaleTimeString("no-NO", { hour:"2-digit", minute:"2-digit" });
      return sameDay ? t : d.toLocaleDateString("no-NO",{day:"numeric",month:"short"}) + " " + t;
    }
    function photoOf(p) { return p?.photo || `https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(p?.name || '?')}`; }
    function findProfile(id) { return allProfiles.find(p => p.id === id); }

    async function loadProfiles() {
      const { data, error } = await sb.from("profiles").select("*").order("name");
      if (error) console.error(error);
      allProfiles = data || [];
    }

    async function loadMyConvs() {
      // Hent mine konversasjoner (DM/grupper) sammen med deres members
      const { data: cm } = await sb.from("conversation_members").select("conversation_id");
      const ids = (cm || []).map(r => r.conversation_id);
      if (!ids.length) { myConvs = []; renderConvList(); return; }
      const { data: convs } = await sb.from("conversations")
        .select("*, conversation_members(user_id)")
        .in("id", ids)
        .order("created_at", { ascending: false });
      myConvs = (convs || []).map(c => ({
        ...c,
        member_ids: (c.conversation_members || []).map(m => m.user_id)
      }));
      renderConvList();
    }

    function convDisplay(conv) {
      if (conv.type === "public" || conv.id === PUBLIC_CONV_ID) {
        return { name: "Felles chat", sub: "Alle medlemmer", iconHTML: `<div class="group-avatar" style="background:var(--surface3); color:var(--orange);">📢</div>` };
      }
      if (conv.type === "group") {
        return { name: conv.name, sub: (conv.member_ids?.length || 0) + " medlemmer", iconHTML: `<div class="group-avatar">${(conv.name || "G").charAt(0).toUpperCase()}</div>` };
      }
      const other = (conv.member_ids || []).find(id => id !== me.id);
      const p = findProfile(other);
      return {
        name: p ? p.name + (p.role === "admin" ? " 👑" : "") : "Ukjent",
        sub: p ? (p.age ? p.age + " år" : "") : "",
        iconHTML: p ? `<img class="avatar" src="${photoOf(p)}" alt="${esc(p.name)}" />` : `<div class="group-avatar">?</div>`
      };
    }

    async function lastMsgFor(convId) {
      const { data } = await sb.from("messages").select("body,from_id,created_at").eq("conversation_id", convId).order("created_at",{ascending:false}).limit(1);
      return data?.[0];
    }

    async function renderConvList() {
      // Felles chat
      const lastPub = await lastMsgFor(PUBLIC_CONV_ID);
      let pubPreview = "Felles for alle medlemmer";
      if (lastPub) {
        const sender = findProfile(lastPub.from_id);
        const prefix = lastPub.from_id === me.id ? "Du" : (sender ? sender.name.split(" ")[0] : "?");
        pubPreview = prefix + ": " + lastPub.body;
      }
      const pubDisp = convDisplay({ id: PUBLIC_CONV_ID, type: "public" });
      document.getElementById("publicConv").innerHTML = `
        <div class="contact ${activeConvId === PUBLIC_CONV_ID ? 'active' : ''}" data-conv-id="${PUBLIC_CONV_ID}" onclick="openConv('${PUBLIC_CONV_ID}','public')">
          ${pubDisp.iconHTML}
          <div class="info"><div class="name">${pubDisp.name}</div><div class="preview">${esc(pubPreview)}</div></div>
        </div>
      `;

      const list = document.getElementById("convList");
      if (!myConvs.length) {
        list.innerHTML = `<div class="empty-state" style="padding:1.5rem .75rem; font-size:.82rem;">Ingen samtaler ennå.<br>Klikk «Ny samtale» eller «Ny gruppe».</div>`;
        return;
      }
      // Hent siste melding for hver
      const previews = await Promise.all(myConvs.map(c => lastMsgFor(c.id)));
      myConvs.forEach((c, i) => c._last = previews[i]);
      myConvs.sort((a, b) => (b._last?.created_at || b.created_at).localeCompare(a._last?.created_at || a.created_at));

      list.innerHTML = myConvs.map(c => {
        const disp = convDisplay(c);
        let preview = "Ingen meldinger ennå";
        if (c._last) {
          const sender = findProfile(c._last.from_id);
          const prefix = c._last.from_id === me.id ? "Du" : (sender ? sender.name.split(" ")[0] : "?");
          preview = prefix + ": " + c._last.body;
        }
        return `
          <div class="contact ${c.id === activeConvId ? 'active' : ''}" data-conv-id="${c.id}" onclick="openConv('${c.id}','${c.type}')">
            ${disp.iconHTML}
            <div class="info"><div class="name">${disp.name}</div><div class="preview">${esc(preview)}</div></div>
          </div>
        `;
      }).join("");
    }

    async function openConv(convId, type) {
      // Avbryt gammelt abonnement umiddelbart
      if (realtimeSub) { sb.removeChannel(realtimeSub); realtimeSub = null; }

      activeConvId = convId;

      const conv = convId === PUBLIC_CONV_ID
        ? { id: convId, type: "public" }
        : myConvs.find(c => c.id === convId) || { id: convId, type };
      const disp = convDisplay(conv);

      // Oppdater header
      const headerEl = document.getElementById("chatHeader");
      headerEl.style.display = "flex";
      document.getElementById("chatHeaderIcon").innerHTML = disp.iconHTML;
      document.getElementById("chatName").textContent = disp.name;
      document.getElementById("chatSub").textContent = disp.sub;
      document.getElementById("dmForm").style.display = "flex";

      // Tøm chat-området umiddelbart slik at gammel samtale forsvinner
      const box = document.getElementById("dmMessages");
      box.innerHTML = `<div class="empty-chat">Laster meldinger...</div>`;

      // Marker aktiv i sidebar (uten å vente på renderConvList)
      document.querySelectorAll(".dm-sidebar .contact").forEach(el => el.classList.remove("active"));
      const activeEl = document.querySelector(`.dm-sidebar .contact[data-conv-id="${convId}"]`);
      if (activeEl) activeEl.classList.add("active");

      await renderMessages();
      subscribeRealtime();
      renderConvList();
    }
    window.openConv = openConv;

    async function renderMessages() {
      const fetchingFor = activeConvId;
      const { data, error } = await sb.from("messages")
        .select("*")
        .eq("conversation_id", fetchingFor)
        .order("created_at", { ascending: true });
      // Hvis bruker har byttet samtale i mellomtiden, hopp ut
      if (fetchingFor !== activeConvId) return;
      if (error) { console.error(error); return; }
      const box = document.getElementById("dmMessages");
      if (!data?.length) {
        box.innerHTML = `<div class="empty-chat">Ingen meldinger ennå. Send den første!</div>`;
        return;
      }
      box.innerHTML = data.map(m => msgHTML(m)).join("");
      box.scrollTop = box.scrollHeight;
    }

    function msgHTML(m) {
      const sender = findProfile(m.from_id);
      const own = m.from_id === me.id;
      const name = sender?.name || "Ukjent";
      const ageStr = sender?.age ? sender.age + " år" : "";
      return `
        <div class="chat-msg ${own ? "own" : ""}">
          <img class="avatar" src="${photoOf(sender)}" alt="${esc(name)}" />
          <div>
            <div class="meta">
              <span class="name">${esc(name)}</span>
              ${ageStr ? `<span class="age">${ageStr}</span>` : ""}
              <span class="time">${fmtTime(m.created_at)}</span>
            </div>
            <div class="bubble">${esc(m.body)}</div>
          </div>
        </div>
      `;
    }

    function subscribeRealtime() {
      if (realtimeSub) sb.removeChannel(realtimeSub);
      realtimeSub = sb.channel(`msg-${activeConvId}`)
        .on("postgres_changes", {
          event: "INSERT", schema: "public", table: "messages",
          filter: `conversation_id=eq.${activeConvId}`
        }, (payload) => {
          const box = document.getElementById("dmMessages");
          if (box.querySelector(".empty-chat")) box.innerHTML = "";
          box.insertAdjacentHTML("beforeend", msgHTML(payload.new));
          box.scrollTop = box.scrollHeight;
          renderConvList();
        })
        .subscribe();
    }

    document.getElementById("dmForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!activeConvId) return;
      const input = document.getElementById("dmInput");
      const txt = input.value.trim();
      if (!txt) return;
      input.value = "";
      const { error } = await sb.from("messages").insert({
        conversation_id: activeConvId,
        from_id: me.id,
        body: txt
      });
      if (error) { alert("Feil: " + error.message); input.value = txt; }
    });

    // Modals
    window.openNewDM = () => {
      const pick = document.getElementById("dmPickList");
      pick.innerHTML = allProfiles
        .filter(p => p.id !== me.id)
        .map(p => `
          <div class="pick-row" onclick="startDM('${p.id}')">
            <img src="${photoOf(p)}" alt="${esc(p.name)}" />
            <span class="pname">${esc(p.name)}${p.role === "admin" ? " 👑" : ""}</span>
          </div>
        `).join("") || `<div class="empty-state">Ingen andre medlemmer ennå.</div>`;
      document.getElementById("newDmModal").classList.add("open");
    };

    window.startDM = async (otherId) => {
      closeModals();
      // Sjekk om DM finnes
      const existing = myConvs.find(c => c.type === "dm" && c.member_ids?.length === 2 && c.member_ids.includes(otherId));
      if (existing) return openConv(existing.id, "dm");
      // Lag ny DM
      const { data: conv, error: e1 } = await sb.from("conversations").insert({
        type: "dm", created_by: me.id
      }).select().single();
      if (e1) { alert("Feil: " + e1.message); return; }
      const { error: e2 } = await sb.from("conversation_members").insert([
        { conversation_id: conv.id, user_id: me.id },
        { conversation_id: conv.id, user_id: otherId }
      ]);
      if (e2) { alert("Feil: " + e2.message); return; }
      await loadMyConvs();
      openConv(conv.id, "dm");
    };

    window.openNewGroup = () => {
      const pick = document.getElementById("groupPickList");
      pick.innerHTML = allProfiles
        .filter(p => p.id !== me.id)
        .map(p => `
          <label class="pick-row">
            <input type="checkbox" value="${p.id}" />
            <img src="${photoOf(p)}" alt="${esc(p.name)}" />
            <span class="pname">${esc(p.name)}${p.role === "admin" ? " 👑" : ""}</span>
          </label>
        `).join("") || `<div class="empty-state">Ingen andre medlemmer ennå.</div>`;
      document.getElementById("groupName").value = "";
      document.getElementById("newGroupModal").classList.add("open");
    };

    window.createGroup = async () => {
      const name = document.getElementById("groupName").value.trim();
      const picked = Array.from(document.querySelectorAll("#groupPickList input:checked")).map(i => i.value);
      if (!name) { alert("Gi gruppen et navn."); return; }
      if (!picked.length) { alert("Velg minst ett medlem."); return; }
      const { data: conv, error: e1 } = await sb.from("conversations").insert({
        type: "group", name, created_by: me.id
      }).select().single();
      if (e1) { alert("Feil: " + e1.message); return; }
      const memberRows = [me.id, ...picked].map(uid => ({ conversation_id: conv.id, user_id: uid }));
      const { error: e2 } = await sb.from("conversation_members").insert(memberRows);
      if (e2) { alert("Feil: " + e2.message); return; }
      closeModals();
      await loadMyConvs();
      openConv(conv.id, "group");
    };

    window.closeModals = () => {
      document.getElementById("newDmModal").classList.remove("open");
      document.getElementById("newGroupModal").classList.remove("open");
    };
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeModals(); });

    (async () => {
      me = await setupPage("chat");
      if (!me) return;
      await loadProfiles();
      await loadMyConvs();
    })();
  </script>
</body>
</html>
