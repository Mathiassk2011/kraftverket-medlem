<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logg inn – 3475 Kraftverket</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="brand" src="https://3475kraftverket.no/wp-content/uploads/2021/04/3d-png-1.png" alt="Kraftverket" />
      <h1>Medlemsportal</h1>
      <p class="sub" id="modeSub">Logg inn med medlemskontoen din</p>

      <div id="error" class="error-msg" style="display:none;"></div>

      <form id="authForm">
        <div class="field">
          <label for="email">E-post</label>
          <input id="email" type="email" autocomplete="email" required autofocus />
        </div>
        <div class="field">
          <label for="password">Passord</label>
          <input id="password" type="password" autocomplete="current-password" required minlength="6" />
        </div>
        <button class="btn btn-primary btn-full" type="submit" id="submitBtn">Logg inn</button>
      </form>

      <p style="margin-top:1.25rem; font-size:.85rem; color:var(--text-muted); line-height:1.6;">
        Kontoer opprettes kun av administrator.<br>
        Ta kontakt med Kraftverket for tilgang.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script>
    // Allerede innlogget? Hopp til dashboard.
    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = "dashboard.html";
    })();

    const form = document.getElementById("authForm");
    const errEl = document.getElementById("error");
    const submitBtn = document.getElementById("submitBtn");

    function showError(msg) { errEl.textContent = msg; errEl.style.display = "block"; }
    function clearMsg()     { errEl.style.display = "none"; }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMsg();
      submitBtn.disabled = true;
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        window.location.href = "dashboard.html";
      } catch (err) {
        showError(err.message || "Noe gikk galt. Prøv igjen.");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
